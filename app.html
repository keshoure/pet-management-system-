<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#10b981" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="PawPulse - All-in-One Pet Care Management Mobile App for Health Records, Vaccinations, Vet Appointments & Smart Reminders" />
  <title>PawPulse 🐾 Pet Care Management App</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- Stylesheets -->
  <link rel="stylesheet" href="/src/styles/variables.css" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/mobile-layout.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <link rel="stylesheet" href="/src/styles/dashboard.css" />
  <link rel="stylesheet" href="/src/styles/pets.css" />
  <link rel="stylesheet" href="/src/styles/health.css" />
  <link rel="stylesheet" href="/src/styles/vaccines.css" />
  <link rel="stylesheet" href="/src/styles/appointments.css" />
  <link rel="stylesheet" href="/src/styles/reminders.css" />
  <link rel="stylesheet" href="/src/styles/passport.css" />
  <link rel="stylesheet" href="/src/styles/print.css" />
</head>
<body>
  <!-- App Mobile Frame Container -->
  <div id="app-root" class="app-root">
    <!-- Back to Website Pill -->
    <a href="/" id="back-to-website-btn" style="position: absolute; top: 18px; left: 18px; z-index: 100; background: var(--bg-surface); border: 1px solid var(--border-card); padding: 0.5rem 0.9rem; border-radius: var(--radius-full); font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 0.4rem;">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Website Home</span>
    </a>
    <script>
      if (window.self !== window.top) {
        document.addEventListener('DOMContentLoaded', () => {
          const btn = document.getElementById('back-to-website-btn');
          if (btn) btn.style.display = 'none';
        });
      }
    </script>

    <!-- Main App Container -->
    <div id="mobile-viewport" class="mobile-viewport">
      <!-- Dynamic Header -->
      <header id="app-header" class="app-header"></header>

      <!-- Main Scrollable Screen Content -->
      <main id="app-main" class="app-main" tabindex="-1"></main>

      <!-- Bottom Navigation Bar -->
      <nav id="bottom-nav" class="bottom-nav"></nav>
    </div>

    <!-- Slide-up Bottom Sheet Modal -->
    <div id="bottom-sheet-container" class="bottom-sheet-overlay hidden">
      <div id="bottom-sheet" class="bottom-sheet">
        <div class="sheet-handle-bar">
          <div class="sheet-handle"></div>
        </div>
        <div id="bottom-sheet-content" class="sheet-content"></div>
      </div>
    </div>

    <!-- General Animated Modal Container -->
    <div id="modal-container" class="modal-overlay hidden">
      <div id="modal-content" class="modal-card"></div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
